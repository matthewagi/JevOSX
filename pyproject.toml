[project]
name = "jevosx"
version = "0.1.0"
description = "Coordinate-free macOS automation agent: accessibility trees in, TypeSafe Jev typed decisions out, local trajectory memory."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]>=0.27,<1",
    "numpy>=1.26",
    "pyobjc-core>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz>=10.3; sys_platform == 'darwin'",
    "pyobjc-framework-Vision>=10.3; sys_platform == 'darwin'",
    "keyring>=25; sys_platform == 'darwin'",
    "anthropic>=1.9,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1", "mypy>=1.10"]

[project.scripts]
jevosx = "jevosx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jevosx"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
# No python_version pin: dependency stubs (e.g. numpy >= 2.5 on 3.12) must be parsed for the running interpreter.
ignore_missing_imports = true
warn_unused_ignores = true
